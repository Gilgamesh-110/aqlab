<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-label="aqlab — Arabic and RTL localization for Android APKs">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#d29922"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="6" fill="url(#accent)"/>

  <!-- wordmark -->
  <text x="80" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="108" font-weight="700" fill="#f0f6fc" letter-spacing="-2">aqlab</text>
  <text x="82" y="204" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" fill="#8b949e">Arabic &amp; RTL localization for Android APKs</text>
  <text x="82" y="248" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace"
        font-size="22" fill="#58a6ff">$ aqlab all app.apk --tsv ar.tsv</text>

  <!-- LTR layout -->
  <rect x="800" y="58" width="132" height="204" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="836" cy="102" r="15" fill="#58a6ff"/>
  <rect x="862" y="94" width="52" height="9" rx="4.5" fill="#30363d"/>
  <rect x="862" y="110" width="34" height="9" rx="4.5" fill="#21262d"/>
  <rect x="820" y="146" width="94" height="9" rx="4.5" fill="#21262d"/>
  <rect x="820" y="164" width="72" height="9" rx="4.5" fill="#21262d"/>
  <rect x="820" y="196" width="94" height="34" rx="10" fill="#1f6feb" opacity="0.85"/>
  <text x="838" y="219" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" fill="#f0f6fc">LTR</text>

  <!-- flip arrow -->
  <g stroke="#3fb950" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M948 152 h44"/>
    <path d="M984 144 l10 8 -10 8"/>
  </g>

  <!-- RTL layout (mirrored) -->
  <rect x="1016" y="58" width="132" height="204" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="1128" cy="102" r="15" fill="#3fb950"/>
  <rect x="1034" y="94" width="52" height="9" rx="4.5" fill="#30363d"/>
  <rect x="1052" y="110" width="34" height="9" rx="4.5" fill="#21262d"/>
  <rect x="1034" y="146" width="94" height="9" rx="4.5" fill="#21262d"/>
  <rect x="1056" y="164" width="72" height="9" rx="4.5" fill="#21262d"/>
  <rect x="1034" y="196" width="94" height="34" rx="10" fill="#238636" opacity="0.85"/>
  <text x="1053" y="219" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" fill="#f0f6fc">RTL</text>
</svg>
