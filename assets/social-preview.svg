<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-label="aqlab — Arabic and RTL localization for Android APKs">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#d29922"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="7" fill="url(#accent)"/>

  <!-- wordmark block -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="88" y="292" font-size="146" font-weight="700" fill="#f0f6fc" letter-spacing="-3">aqlab</text>
    <text x="92" y="352" font-size="28" fill="#a5adba">Arabic &amp; RTL localization for Android APKs</text>
  </g>
  <text x="92" y="408" font-size="24" fill="#58a6ff"
        font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">$ aqlab all app.apk --tsv ar.tsv</text>
  <text x="92" y="500" font-size="22" fill="#8b949e"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">android · rtl · bidi · apktool · zero dependencies · MIT</text>

  <!-- LTR layout -->
  <rect x="780" y="141" width="190" height="358" rx="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="828" cy="197" r="20" fill="#58a6ff"/>
  <rect x="864" y="183" width="72" height="12" rx="6" fill="#3d444d"/>
  <rect x="864" y="205" width="48" height="12" rx="6" fill="#21262d"/>
  <rect x="808" y="277" width="134" height="12" rx="6" fill="#21262d"/>
  <rect x="808" y="301" width="100" height="12" rx="6" fill="#21262d"/>
  <rect x="808" y="413" width="134" height="50" rx="14" fill="#1f6feb" opacity="0.92"/>
  <text x="875" y="444" font-size="20" text-anchor="middle" fill="#f0f6fc"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">LTR</text>

  <!-- flip arrow -->
  <g stroke="#3fb950" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M976 330 h28"/>
    <path d="M996 319 l12 11 -12 11"/>
  </g>

  <!-- RTL layout, mirrored -->
  <rect x="1025" y="141" width="190" height="358" rx="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="1167" cy="197" r="20" fill="#3fb950"/>
  <rect x="1059" y="183" width="72" height="12" rx="6" fill="#3d444d"/>
  <rect x="1083" y="205" width="48" height="12" rx="6" fill="#21262d"/>
  <rect x="1053" y="277" width="134" height="12" rx="6" fill="#21262d"/>
  <rect x="1087" y="301" width="100" height="12" rx="6" fill="#21262d"/>
  <rect x="1053" y="413" width="134" height="50" rx="14" fill="#238636" opacity="0.92"/>
  <text x="1120" y="444" font-size="20" text-anchor="middle" fill="#f0f6fc"
        font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">RTL</text>
</svg>
