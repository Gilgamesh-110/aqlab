      <rect x="126" y="66" width="50" height="15" rx="7.5" fill="#2b2411" stroke="#8a7020"/>
      <rect x="94" y="94" width="82" height="22" rx="11" fill="#0e2a1e" stroke="#2ea043" stroke-width="1.2"/>
      <rect x="108" y="102" width="54" height="6" rx="3" fill="#3fb950"/>
      <rect x="16" y="94" width="72" height="22" rx="11" fill="#0a1512" stroke="#1e2b25"/>
      <rect x="32" y="102" width="40" height="6" rx="3" fill="#44584f"/>
      <rect x="106" y="130" width="70" height="6" rx="3" fill="#8b949e" opacity="0.65"/>
      <rect x="62" y="150" width="114" height="8" rx="4" fill="#e6ede9" opacity="0.9"/>
      <g fill="#6f8a7e" opacity="0.75">
        <rect x="34" y="170" width="142" height="5" rx="2.5"/>
        <rect x="58" y="182" width="118" height="5" rx="2.5"/>
        <rect x="46" y="194" width="130" height="5" rx="2.5"/>
        <rect x="76" y="206" width="100" height="5" rx="2.5"/>
        <rect x="54" y="218" width="122" height="5" rx="2.5"/>
      </g>
      <rect x="106" y="240" width="70" height="20" rx="10" fill="#238636"/>
      <rect x="122" y="247" width="38" height="6" rx="3" fill="#ffffff" opacity="0.92"/>
      <rect x="16" y="240" width="62" height="20" rx="10" fill="#0d1a15" stroke="#1e2b25"/>
      <rect x="30" y="247" width="34" height="6" rx="3" fill="#5a6f65"/>
      <rect x="70" y="278" width="50" height="16" rx="4" fill="#0b1d16"/>
      <rect x="84" y="284" width="22" height="7" rx="3" fill="#3fb950" opacity="0.8"/>
