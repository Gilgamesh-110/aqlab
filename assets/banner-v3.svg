        <text x="46" y="16" fill="#c9d1d9">العربية</text>
        <text x="112" y="16" fill="#c9d1d9">עברית</text>
        <text x="168" y="16" fill="#c9d1d9">فارسی</text>
        <text x="222" y="16" fill="#c9d1d9">اردو</text>
        <text x="270" y="16" fill="#c9d1d9">پښتو</text>
      </g>
      <line x1="322" y1="4" x2="322" y2="20" stroke="#262d36"/>
      <g font-size="15" font-weight="600" fill="#6e7681">
        <text x="340" y="16" font-weight="500" fill="#5a6472">LTR</text>
        <text x="386" y="16">日本語</text>
        <text x="440" y="16">Deutsch</text>
        <text x="510" y="16">ไทย</text>
        <text x="542" y="16">+217</text>
      </g>
    </g>

    <g transform="translate(0 312)" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600">
      <g>
        <rect x="0" y="0" width="158" height="32" rx="16" fill="#238636" fill-opacity="0.14" stroke="#2ea043"/>
        <circle cx="17" cy="16" r="3.5" fill="#3fb950"/>
        <text x="30" y="21" fill="#3fb950">0 crashes, on device</text>
      </g>
      <g transform="translate(168 0)">
