      <rect x="120" y="14" width="52" height="7" rx="3.5" fill="#a9d5c8" opacity="0.85"/>
      <rect x="134" y="27" width="38" height="5" rx="2.5" fill="#557065"/>
      <g fill="#2f4a40">
