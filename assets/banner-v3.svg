        <text x="30" y="21" fill="#58a6ff">227 locales</text>
      </g>
      <g transform="translate(304 0)">
        <rect x="0" y="0" width="120" height="32" rx="16" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb"/>
        <circle cx="17" cy="16" r="3.5" fill="#58a6ff"/>
        <text x="30" y="21" fill="#58a6ff">258 RTL</text>
      </g>
      <g transform="translate(434 0)">
        <rect x="0" y="0" width="112" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
        <circle cx="17" cy="16" r="3.5" fill="#6e7681"/>
        <text x="30" y="21" fill="#8b949e">610 tests</text>
      </g>
    </g>
  </g>

