<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img"
     aria-label="aqlab — localize any Android app into any language and any text direction, in one command. 227 locales, 258 RTL tags, verified on a real device with zero crashes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0a0d13"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0e1726"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="markA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <ellipse cx="1020" cy="140" rx="380" ry="230" fill="url(#glowA)"/>
  <ellipse cx="1180" cy="380" rx="260" ry="180" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" fill="none" stroke="#1c2128"/>

  <!-- ================= LEFT: identity ================= -->
  <g transform="translate(64 66)">
    <g>
      <rect x="0" y="0" width="84" height="84" rx="20" fill="#0d1117" stroke="#262d36" stroke-width="1.5"/>
      <line x1="42" y1="14" x2="42" y2="70" stroke="url(#seam)" stroke-width="1.5"/>
      <g fill="#5a6472">
        <rect x="11" y="20" width="24" height="9" rx="2.5"/>
        <rect x="11" y="37" width="15" height="9" rx="2.5"/>
        <rect x="11" y="54" width="21" height="9" rx="2.5"/>
      </g>
      <g fill="#58a6ff">
        <rect x="49" y="20" width="24" height="9" rx="2.5"/>
        <rect x="58" y="37" width="15" height="9" rx="2.5"/>
        <rect x="52" y="54" width="21" height="9" rx="2.5"/>
      </g>
    </g>

    <text x="104" y="46" font-family="Inter, 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="56" font-weight="800" letter-spacing="-2.4" fill="#f0f6fc">aqlab</text>
    <text x="105" y="72" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace"
          font-size="14.5" font-weight="500" fill="#5a6472" letter-spacing="0.6">localization workbench for Android APKs</text>

    <text x="0" y="150" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700"
          fill="#f0f6fc" letter-spacing="-0.9">Any language. Any direction.</text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400"
          fill="#8b949e">Translate, migrate RTL, rebuild — one command.</text>

    <g transform="translate(0 214)">
      <rect x="0" y="0" width="392" height="44" rx="9" fill="#11161d" stroke="#262d36"/>
      <circle cx="20" cy="22" r="4.5" fill="#30363d"/>
      <circle cx="36" cy="22" r="4.5" fill="#30363d"/>
      <circle cx="52" cy="22" r="4.5" fill="#30363d"/>
      <line x1="66" y1="10" x2="66" y2="34" stroke="#262d36"/>
      <text x="80" y="28" font-family="ui-monospace, Consolas, monospace" font-size="16.5" fill="#5a6472">$</text>
      <text x="98" y="28" font-family="ui-monospace, Consolas, monospace" font-size="16.5" fill="#58a6ff">aqlab all</text>
      <text x="192" y="28" font-family="ui-monospace, Consolas, monospace" font-size="16.5" fill="#8b949e">app.apk</text>
      <text x="276" y="28" font-family="ui-monospace, Consolas, monospace" font-size="16.5" fill="#3fb950">--locale fa</text>
    </g>

    <g transform="translate(0 274)" font-family="Inter, system-ui, sans-serif">
      <g font-size="15" font-weight="600" fill="#8b949e">
        <text x="0" y="16" fill="#5a6472" font-weight="500">RTL</text>
        <text x="46" y="16" fill="#c9d1d9">العربية</text>
        <text x="112" y="16" fill="#c9d1d9">עברית</text>
        <text x="168" y="16" fill="#c9d1d9">فارسی</text>
        <text x="222" y="16" fill="#c9d1d9">اردو</text>
        <text x="270" y="16" fill="#c9d1d9">پښتو</text>
      </g>
      <line x1="322" y1="4" x2="322" y2="20" stroke="#262d36"/>
      <g font-size="15" font-weight="600" fill="#6e7681">
        <text x="340" y="16" font-weight="500" fill="#5a6472">LTR</text>
        <text x="386" y="16">日本語</text>
        <text x="440" y="16">Deutsch</text>
        <text x="512" y="16">ไทย</text>
        <text x="552" y="16" fill="#4d565f">+217</text>
      </g>
    </g>

    <g transform="translate(0 312)" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600">
      <g>
        <rect x="0" y="0" width="158" height="32" rx="16" fill="#238636" fill-opacity="0.14" stroke="#2ea043"/>
        <circle cx="17" cy="16" r="3.5" fill="#3fb950"/>
        <text x="30" y="21" fill="#3fb950">0 crashes, on device</text>
      </g>
      <g transform="translate(168 0)">
        <rect x="0" y="0" width="126" height="32" rx="16" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb"/>
        <circle cx="17" cy="16" r="3.5" fill="#58a6ff"/>
        <text x="30" y="21" fill="#58a6ff">227 locales</text>
      </g>
      <g transform="translate(304 0)">
        <rect x="0" y="0" width="120" height="32" rx="16" fill="#1f6feb" fill-opacity="0.12" stroke="#1f6feb"/>
        <circle cx="17" cy="16" r="3.5" fill="#58a6ff"/>
        <text x="30" y="21" fill="#58a6ff">258 RTL</text>
      </g>
      <g transform="translate(434 0)">
        <rect x="0" y="0" width="112" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
        <circle cx="17" cy="16" r="3.5" fill="#6e7681"/>
        <text x="30" y="21" fill="#8b949e">668 tests</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: same screen, three locales ================= -->
  <g filter="url(#ds)">

    <!-- 1. JAPANESE (LTR, left-anchored) -->
    <g transform="translate(716 76)">
      <rect x="0" y="0" width="152" height="272" rx="20" fill="#0b1020" stroke="#2b3446" stroke-width="1.5"/>
      <rect x="0" y="0" width="152" height="40" rx="20" fill="#101a2e"/>
      <rect x="0" y="26" width="152" height="14" fill="#101a2e"/>
      <text x="14" y="26" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#dfe8f7">チェス</text>
      <text x="14" y="36" font-family="ui-monospace, monospace" font-size="7" fill="#6b7f9e">Stockfish 19</text>
      <rect x="106" y="12" width="32" height="14" rx="7" fill="#16233b" stroke="#2c3f60"/>
      <text x="122" y="22" font-family="Inter, sans-serif" font-size="6.5" fill="#8fb3e0" text-anchor="middle">言語</text>
      <rect x="14" y="50" width="52" height="17" rx="8.5" fill="#101a2e" stroke="#2b3446"/>
      <text x="40" y="62" font-family="Inter, sans-serif" font-size="7.5" fill="#9db4d4" text-anchor="middle">チェッカー</text>
      <rect x="72" y="50" width="52" height="17" rx="8.5" fill="#12294a" stroke="#4d8ae0"/>
      <text x="98" y="62" font-family="Inter, sans-serif" font-size="7.5" fill="#7fb2f0" text-anchor="middle">チェス</text>
      <text x="14" y="84" font-family="Inter, sans-serif" font-size="7.5" fill="#7f90a8">準備完了。開始を押してください。</text>
      <text x="14" y="102" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#e3ebf7">アプリを閉じて実行</text>
      <g fill="#5f708a">
        <rect x="14" y="112" width="124" height="4" rx="2"/>
        <rect x="14" y="121" width="106" height="4" rx="2"/>
        <rect x="14" y="130" width="118" height="4" rx="2"/>
        <rect x="14" y="139" width="92" height="4" rx="2"/>
      </g>
      <rect x="14" y="160" width="56" height="16" rx="8" fill="#16233b" stroke="#2b3446"/>
      <text x="42" y="171" font-family="Inter, sans-serif" font-size="6.5" fill="#8fb3e0" text-anchor="middle">設定</text>
      <rect x="76" y="160" width="56" height="16" rx="8" fill="#1b4d8a"/>
      <text x="104" y="171" font-family="Inter, sans-serif" font-size="6.5" fill="#cfe2fb" text-anchor="middle">開始</text>
      <text x="14" y="200" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#8fb3e0">0</text>
      <text x="14" y="210" font-family="Inter, sans-serif" font-size="6" fill="#5f708a">解析済みの手</text>
      <rect x="0" y="0" width="152" height="272" rx="20" fill="none" stroke="#1b2434"/>
    </g>

    <!-- 2. HEBREW (RTL, right-anchored) -->
    <g transform="translate(878 76)">
      <rect x="0" y="0" width="152" height="272" rx="20" fill="#0a1219" stroke="#2a3a44" stroke-width="1.5"/>
      <rect x="0" y="0" width="152" height="40" rx="20" fill="#0f1e24"/>
      <rect x="0" y="26" width="152" height="14" fill="#0f1e24"/>
      <text x="138" y="26" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d7ece4" text-anchor="end">שחמט</text>
      <text x="138" y="36" font-family="ui-monospace, monospace" font-size="7" fill="#5d7d72" text-anchor="end">Stockfish 19</text>
      <rect x="14" y="12" width="32" height="14" rx="7" fill="#12251f" stroke="#28483c"/>
      <text x="30" y="22" font-family="Inter, Arial, sans-serif" font-size="6.5" fill="#8fc2ae" text-anchor="middle">שפה</text>
      <rect x="86" y="50" width="52" height="17" rx="8.5" fill="#0e2721" stroke="#2ea043"/>
      <text x="112" y="62" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#3fb950" text-anchor="middle">שחמט</text>
      <rect x="28" y="50" width="52" height="17" rx="8.5" fill="#0a1512" stroke="#1e2b25"/>
      <text x="54" y="62" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#546e63" text-anchor="middle">דמקה</text>
      <text x="138" y="84" font-family="Inter, Arial, sans-serif" font-size="7.5" fill="#6c8378" text-anchor="end">מוכן. לחץ התחל.</text>
      <text x="138" y="102" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#dbe9e3" text-anchor="end">סגור את האפליקציה</text>
      <g fill="#4e665c">
        <rect x="14" y="112" width="124" height="4" rx="2"/>
        <rect x="32" y="121" width="106" height="4" rx="2"/>
        <rect x="20" y="130" width="118" height="4" rx="2"/>
        <rect x="46" y="139" width="92" height="4" rx="2"/>
      </g>
      <rect x="82" y="160" width="56" height="16" rx="8" fill="#17332a"/>
      <text x="110" y="171" font-family="Inter, Arial, sans-serif" font-size="6.5" fill="#c4e3d6" text-anchor="middle">התחל</text>
      <rect x="20" y="160" width="56" height="16" rx="8" fill="#0d1c17" stroke="#1e2b25"/>
      <text x="48" y="171" font-family="Inter, Arial, sans-serif" font-size="6.5" fill="#6c8378" text-anchor="middle">הגדרות</text>
      <text x="138" y="200" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#8fc2ae" text-anchor="end">0</text>
      <text x="138" y="210" font-family="Inter, Arial, sans-serif" font-size="6" fill="#4e665c" text-anchor="end">מהלכים שניתחו</text>
      <rect x="0" y="0" width="152" height="272" rx="20" fill="none" stroke="#16241f"/>
    </g>

    <!-- 3. ARABIC (RTL) - the real one, kept largest -->
    <g transform="translate(1040 62)">
      <rect x="-3" y="-3" width="196" height="300" rx="26" fill="#11161d" stroke="#30363d" stroke-width="1.5"/>
      <clipPath id="scr"><rect x="6" y="8" width="178" height="278" rx="20"/></clipPath>
      <g clip-path="url(#scr)">
        <rect x="6" y="8" width="178" height="278" fill="#07140f"/>
        <rect x="6" y="8" width="178" height="140" fill="#0c2419"/>
        <text x="170" y="38" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="12.5" font-weight="700" fill="#e2ebe6" text-anchor="end">الشطرنج</text>
        <text x="170" y="50" font-family="ui-monospace, monospace" font-size="7.5" fill="#5f8271" text-anchor="end">Stockfish 19</text>
        <rect x="18" y="30" width="36" height="16" rx="8" fill="#0f2b21" stroke="#2c4d3e"/>
        <text x="36" y="41" font-family="Inter, sans-serif" font-size="7" fill="#8fc2ab" text-anchor="middle">اللغة</text>
        <rect x="112" y="62" width="58" height="17" rx="8.5" fill="#0e2a1e" stroke="#2ea043" stroke-width="1.2"/>
        <text x="141" y="74" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="8" fill="#3fb950" text-anchor="middle">الشطرنج</text>
        <rect x="32" y="62" width="50" height="17" rx="8.5" fill="#0a1512" stroke="#1e2b25"/>
        <text x="57" y="74" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="8" fill="#546e63" text-anchor="middle">الداما</text>
        <text x="170" y="94" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="7.5" fill="#7d998c" text-anchor="end">جاهز. المس ابدأ ثم افتح مباراة.</text>
        <text x="170" y="112" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="9" font-weight="700" fill="#e2ebe6" text-anchor="end">أغلق هاتفك أثناء التحليل</text>
        <g fill="#5c7a6c">
          <rect x="30" y="122" width="140" height="4" rx="2"/>
          <rect x="52" y="131" width="118" height="4" rx="2"/>
          <rect x="40" y="140" width="130" height="4" rx="2"/>
          <rect x="68" y="149" width="102" height="4" rx="2"/>
        </g>
        <rect x="98" y="170" width="72" height="18" rx="9" fill="#238636"/>
        <text x="134" y="182" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">إعدادات</text>
        <rect x="18" y="170" width="72" height="18" rx="9" fill="#0d1a15" stroke="#1e2b25"/>
        <text x="54" y="182" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="7" fill="#6c8378" text-anchor="middle">إخفاء التلميح</text>
        <text x="100" y="226" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#3fb950" text-anchor="middle">0</text>
        <text x="100" y="240" font-family="Inter, 'Segoe UI', Tahoma, sans-serif" font-size="6.5" fill="#5c7a6c" text-anchor="middle">نقلة محلّلة</text>
      </g>
      <rect x="6" y="8" width="178" height="278" rx="20" fill="none" stroke="#1e2b25"/>
    </g>
  </g>

  <text x="938" y="382" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
        font-size="12" fill="#4d565f" letter-spacing="0.6">one screen · three locales · one pass</text>
</svg>
