<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-label="Before and after: the same screen in LTR and RTL, with the attribute migration that produces it">
  <rect width="1200" height="560" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="60" y="52" font-size="20" font-weight="600" fill="#8b949e">before</text>
    <text x="270" y="52" font-size="20" font-weight="600" fill="#3fb950">after</text>
    <text x="500" y="52" font-size="20" font-weight="600" fill="#8b949e">what changed</text>
  </g>

  <!-- BEFORE : LTR layout -->
  <rect x="60" y="70" width="170" height="430" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M88 100 l-9 9 9 9" stroke="#8b949e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="104" y="102" width="54" height="12" rx="6" fill="#3d444d"/>
  <circle cx="146" cy="126" r="7" fill="none" stroke="#6e7681" stroke-width="2"/>
  <g fill="#21262d">
    <rect x="76" y="160" width="138" height="64" rx="10"/>
    <rect x="76" y="236" width="138" height="64" rx="10"/>
    <rect x="76" y="312" width="138" height="64" rx="10"/>
    <rect x="76" y="388" width="138" height="64" rx="10"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="98" cy="192" r="12"/><circle cx="98" cy="268" r="12"/>
    <circle cx="98" cy="344" r="12"/><circle cx="98" cy="420" r="12"/>
  </g>
  <g fill="#3d444d">
    <rect x="118" y="182" width="72" height="9" rx="4.5"/><rect x="118" y="197" width="46" height="9" rx="4.5"/>
    <rect x="118" y="258" width="72" height="9" rx="4.5"/><rect x="118" y="273" width="46" height="9" rx="4.5"/>
    <rect x="118" y="334" width="72" height="9" rx="4.5"/><rect x="118" y="349" width="46" height="9" rx="4.5"/>
    <rect x="118" y="410" width="72" height="9" rx="4.5"/><rect x="118" y="425" width="46" height="9" rx="4.5"/>
  </g>

  <!-- AFTER : RTL layout, mirrored -->
  <rect x="270" y="70" width="170" height="430" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M412 100 l9 9 -9 9" stroke="#8b949e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="316" y="102" width="54" height="12" rx="6" fill="#3d444d"/>
  <circle cx="364" cy="126" r="7" fill="none" stroke="#6e7681" stroke-width="2"/>
  <g fill="#21262d">
    <rect x="286" y="160" width="138" height="64" rx="10"/>
    <rect x="286" y="236" width="138" height="64" rx="10"/>
    <rect x="286" y="312" width="138" height="64" rx="10"/>
    <rect x="286" y="388" width="138" height="64" rx="10"/>
  </g>
  <g fill="#3fb950">
    <circle cx="404" cy="192" r="12"/><circle cx="404" cy="268" r="12"/>
    <circle cx="404" cy="344" r="12"/><circle cx="404" cy="420" r="12"/>
  </g>
  <g fill="#3d444d">
    <rect x="304" y="182" width="72" height="9" rx="4.5"/><rect x="330" y="197" width="46" height="9" rx="4.5"/>
    <rect x="304" y="258" width="72" height="9" rx="4.5"/><rect x="330" y="273" width="46" height="9" rx="4.5"/>
    <rect x="304" y="334" width="72" height="9" rx="4.5"/><rect x="330" y="349" width="46" height="9" rx="4.5"/>
    <rect x="304" y="410" width="72" height="9" rx="4.5"/><rect x="330" y="425" width="46" height="9" rx="4.5"/>
  </g>

  <!-- divider -->
  <rect x="472" y="70" width="1" height="430" fill="#21262d"/>

  <!-- the diff -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="15.5">
    <text x="500" y="102" fill="#58a6ff">AndroidManifest.xml</text>
    <text x="500" y="132" fill="#c9d1d9">    &lt;application</text>
    <text x="500" y="158" fill="#3fb950">+       android:supportsRtl="true"</text>
    <text x="500" y="184" fill="#c9d1d9">        android:label="@string/app_name"&gt;</text>

    <text x="500" y="230" fill="#58a6ff">res/layout/activity_main.xml</text>
    <text x="500" y="260" fill="#f85149">-       android:paddingLeft="16dp"</text>
    <text x="500" y="286" fill="#3fb950">+       android:paddingStart="16dp"</text>
    <text x="500" y="312" fill="#f85149">-       android:drawableLeft="@drawable/ic_folder"</text>
    <text x="500" y="338" fill="#3fb950">+       android:drawableStart="@drawable/ic_folder"</text>
    <text x="500" y="364" fill="#f85149">-       android:gravity="left|center_vertical"</text>
    <text x="500" y="390" fill="#3fb950">+       android:gravity="start|center_vertical"</text>
    <text x="500" y="416" fill="#f85149">-       app:layout_constraintLeft_toLeftOf="parent"</text>
    <text x="500" y="442" fill="#3fb950">+       app:layout_constraintStart_toStartOf="parent"</text>
    <text x="500" y="482" fill="#8b949e">$ aqlab rtl work  →  4 files updated</text>
  </g>
</svg>
