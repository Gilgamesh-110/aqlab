<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Before: wrong LTR layout. After: correct RTL layout.">
  <rect width="1200" height="600" fill="#0d1117"/>

  <defs>
    <!-- one screen, 500x416; accent parts use currentColor -->
    <g id="screen">
      <rect x="1" y="1" width="498" height="414" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <!-- app bar -->
      <rect x="1" y="1" width="498" height="62" fill="#21262d"/>
      <g fill="currentColor">
        <rect x="24" y="22" width="28" height="4"/>
        <rect x="24" y="30" width="28" height="4"/>
        <rect x="24" y="38" width="28" height="4"/>
      </g>
      <rect x="76" y="24" width="150" height="16" fill="#f0f6fc"/>
      <circle cx="456" cy="32" r="16" fill="#30363d"/>
      <!-- back row -->
      <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
        <line x1="26" y1="100" x2="52" y2="100"/>
        <polyline points="36,90 26,100 36,110"/>
      </g>
      <rect x="72" y="92" width="120" height="16" fill="#f0f6fc"/>
      <!-- list -->
      <rect x="16" y="132" width="468" height="64" fill="#21262d"/>
      <rect x="32" y="144" width="40" height="40" fill="#30363d"/>
      <rect x="88" y="148" width="200" height="12" fill="#f0f6fc"/>
      <rect x="88" y="168" width="130" height="10" fill="#8b949e"/>
      <polyline points="448,154 460,164 448,174" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>

      <rect x="16" y="208" width="468" height="64" fill="#21262d"/>
      <rect x="32" y="220" width="40" height="40" fill="#30363d"/>
      <rect x="88" y="224" width="160" height="12" fill="#f0f6fc"/>
      <rect x="88" y="244" width="110" height="10" fill="#8b949e"/>
      <polyline points="448,230 460,240 448,250" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
<rect x="16" y="284" width="468" height="64" fill="#21262d"/>
      <rect x="32" y="296" width="40" height="40" fill="#30363d"/>
      <rect x="88" y="300" width="224" height="12" fill="#f0f6fc"/>
      <rect x="88" y="320" width="96" height="10" fill="#8b949e"/>
      <polyline points="448,306 460,316 448,326" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
      <!-- action button -->
      <circle cx="456" cy="382" r="18" fill="currentColor"/>
      <rect x="449" y="380" width="14" height="4" fill="#0d1117"/>
      <rect x="454" y="375" width="4" height="14" fill="#0d1117"/>
    </g>
  </defs>

  <!-- labels -->
  <rect x="64" y="80" width="14" height="14" fill="#d29922"/>
  <rect x="636" y="80" width="14" height="14" fill="#3fb950"/>
  <g font-family="Inter, 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">
    <text x="90" y="95" fill="#d29922">BEFORE · LTR</text>
    <text x="662" y="95" fill="#3fb950">AFTER · RTL</text>
  </g>

  <!-- screens -->
  <use href="#screen" xlink:href="#screen" transform="translate(64 120)" color="#d29922"/>
  <use href="#screen" xlink:href="#screen" transform="translate(1136 120) scale(-1 1)" color="#3fb950"/>

  <!-- flip arrow -->
  <g fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <line x1="582" y1="328" x2="618" y2="328"/>
    <polyline points="606,316 618,328 606,340"/>
  </g>
</svg>
