<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img"
     aria-label="aqlab — flip any Android app to Arabic. LTR layout on the left becomes RTL on the right, in one command. Verified on a real device, zero crashes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="screenFade">
      <rect x="0" y="0" width="1280" height="420" fill="url(#fadeR)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <ellipse cx="840" cy="130" rx="420" ry="250" fill="url(#glowA)"/>
  <ellipse cx="1050" cy="340" rx="300" ry="200" fill="url(#glowB)"/>

  <!-- hairline frame -->
  <rect x="0.5" y="0.5" width="1279" height="419" fill="none" stroke="#21262d"/>

  <!-- ============ left: identity ============ -->
  <g transform="translate(64 76)">
    <!-- logo mark -->
    <g>
      <rect x="0" y="0" width="96" height="96" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <line x1="48" y1="16" x2="48" y2="80" stroke="#21262d" stroke-width="2"/>
      <g fill="#6e7681">
        <rect x="14" y="26" width="26" height="9" rx="2"/>
        <rect x="14" y="43" width="17" height="9" rx="2"/>
        <rect x="14" y="60" width="22" height="9" rx="2"/>
      </g>
      <g fill="#58a6ff">
        <rect x="56" y="26" width="26" height="9" rx="2"/>
        <rect x="65" y="43" width="17" height="9" rx="2"/>
        <rect x="60" y="60" width="22" height="9" rx="2"/>
      </g>
    </g>

    <text x="120" y="52" font-family="Inter, 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="62" font-weight="800" letter-spacing="-2.5" fill="#f0f6fc">aqlab</text>
    <text x="121" y="82" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace"
          font-size="17" font-weight="500" fill="#6e7681" letter-spacing="0.4">/ˈaqlab/ — the laboratory of minds</text>

    <text x="0" y="152" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700"
          fill="#f0f6fc" letter-spacing="-0.6">Flip any Android app to Arabic.</text>
    <text x="0" y="196" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400"
          fill="#8b949e">RTL-correct. One command. No guessing.</text>

    <!-- command chip -->
    <g transform="translate(0 224)">
      <rect x="0" y="0" width="352" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="16" y="30" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#6e7681">$</text>
      <text x="38" y="30" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#58a6ff">aqlab all</text>
      <text x="150" y="30" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#8b949e">app.apk -l ar</text>
    </g>

    <!-- proof chips -->
    <g transform="translate(0 292)" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">
      <g transform="translate(0 0)">
        <rect x="0" y="0" width="176" height="34" rx="17" fill="#238636" fill-opacity="0.16" stroke="#238636"/>
        <circle cx="19" cy="17" r="4" fill="#3fb950"/>
        <text x="33" y="23" fill="#3fb950">0 crashes on device</text>
      </g>
      <g transform="translate(188 0)">
        <rect x="0" y="0" width="158" height="34" rx="17" fill="#1f6feb" fill-opacity="0.14" stroke="#1f6feb"/>
        <circle cx="19" cy="17" r="4" fill="#58a6ff"/>
        <text x="33" y="23" fill="#58a6ff">1,043 layouts</text>
      </g>
      <g transform="translate(358 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#30363d" fill-opacity="0.5" stroke="#484f58"/>
        <circle cx="19" cy="17" r="4" fill="#8b949e"/>
        <text x="33" y="23" fill="#8b949e">610 checks</text>
      </g>
    </g>
  </g>

  <!-- ============ right: device, mirrored ============ -->
  <!-- back plate -->
  <g transform="translate(714 50)">
    <rect x="0" y="0" width="240" height="330" rx="30" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="8" y="10" width="224" height="310" rx="24" fill="#010409"/>
  </g>
  <!-- arrow at the seam -->
  <g transform="translate(697 210)" opacity="0.9">
    <line x1="0" y1="-52" x2="0" y2="52" stroke="url(#accent)" stroke-width="2" stroke-dasharray="4 6"/>
  </g>

  <!-- RTL screen: mirrored look, drawn -->
  <g transform="translate(722 60)">
    <rect x="0" y="0" width="224" height="310" rx="24" fill="#0b2018"/>
    <!-- top bar -->
    <rect x="0" y="0" width="224" height="46" rx="24" fill="#0f2b21"/>
    <rect x="0" y="30" width="224" height="16" fill="#0f2b21"/>
    <circle cx="42" cy="23" r="11" fill="#1f6f4a"/>
    <text x="42" y="28" font-family="Inter, sans-serif" font-size="10" fill="#d7f5e6" text-anchor="middle">♞</text>
    <!-- right-aligned title -->
    <rect x="132" y="14" width="76" height="7" rx="3.5" fill="#d7f5e6" opacity="0.85"/>
    <rect x="152" y="26" width="56" height="5" rx="2.5" fill="#7ee2b8" opacity="0.55"/>
    <!-- tabs -->
    <rect x="118" y="58" width="88" height="22" rx="11" fill="#14291f" stroke="#2ea043"/>
    <rect x="132" y="66" width="60" height="6" rx="3" fill="#3fb950"/>
    <rect x="30" y="58" width="78" height="22" rx="11" fill="#101b17"/>
    <rect x="46" y="66" width="46" height="6" rx="3" fill="#4b5a53"/>
    <!-- body lines, right aligned -->
    <g fill="#8b949e" opacity="0.5">
      <rect x="44" y="96" width="164" height="6" rx="3"/>
      <rect x="86" y="110" width="122" height="6" rx="3"/>
    </g>
    <rect x="0" y="130" width="224" height="1" fill="#1b2b24"/>
    <g fill="#c9d1d9" opacity="0.75">
      <rect x="60" y="146" width="148" height="8" rx="4"/>
      <rect x="96" y="162" width="112" height="6" rx="3"/>
      <rect x="120" y="176" width="88" height="6" rx="3"/>
      <rect x="76" y="196" width="132" height="6" rx="3"/>
      <rect x="104" y="210" width="104" height="6" rx="3"/>
    </g>
    <!-- buttons bottom right -->
    <rect x="112" y="240" width="96" height="26" rx="13" fill="#238636"/>
    <rect x="130" y="250" width="60" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="14" y="240" width="86" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <rect x="34" y="250" width="46" height="6" rx="3" fill="#8b949e"/>
  </g>

  <!-- LTR screen, faded, behind -->
  <g transform="translate(952 50)" opacity="0.28" mask="url(#screenFade)">
    <rect x="0" y="0" width="240" height="330" rx="30" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <rect x="8" y="10" width="224" height="310" rx="24" fill="#0b1020"/>
    <rect x="8" y="10" width="224" height="46" rx="24" fill="#0f1730"/>
    <rect x="8" y="40" width="224" height="16" fill="#0f1730"/>
    <!-- left aligned = the broken state -->
    <rect x="24" y="24" width="76" height="7" rx="3.5" fill="#d7e2f5" opacity="0.85"/>
    <rect x="24" y="36" width="56" height="5" rx="2.5" fill="#7ea8e2" opacity="0.55"/>
    <rect x="24" y="68" width="88" height="22" rx="11" fill="#14291f" stroke="#2ea043"/>
    <rect x="38" y="76" width="60" height="6" rx="3" fill="#3fb950"/>
    <g fill="#8b949e" opacity="0.5">
      <rect x="24" y="106" width="164" height="6" rx="3"/>
      <rect x="24" y="120" width="122" height="6" rx="3"/>
    </g>
    <g fill="#c9d1d9" opacity="0.7">
      <rect x="24" y="156" width="148" height="8" rx="4"/>
      <rect x="24" y="172" width="112" height="6" rx="3"/>
      <rect x="24" y="186" width="88" height="6" rx="3"/>
    </g>
    <rect x="24" y="250" width="96" height="26" rx="13" fill="#238636"/>
    <rect x="42" y="260" width="60" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- the seam arrow -->
  <g transform="translate(946 210)">
    <circle cx="0" cy="0" r="26" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <path d="M -9 -11 L 9 0 L -9 11 Z" fill="#3fb950"/>
  </g>
</svg>
