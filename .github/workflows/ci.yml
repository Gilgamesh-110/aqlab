name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push while the first is still queued should drop the first, not leave
# two runs fighting for the same scarce runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # keep the matrix cheap: full OS spread only on the edge versions.
          # macOS runners are the scarce ones on the free tier and a job that
          # cannot get a runner in ~15 min is cancelled, which shows up as a red
          # badge on main even though nothing was wrong with the code — so macOS
          # gets the floor and the ceiling only (2 jobs, not 5).
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile aqlab.py

      - name: Tests
        run: python tests/test_aqlab.py

      - name: README quickstart still matches the docs
        run: python tests/test_readme.py

      - name: CLI smoke
        run: |
          python aqlab.py --version
          python aqlab.py --help > /dev/null
        shell: bash
