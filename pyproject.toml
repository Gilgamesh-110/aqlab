[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aqlab"
version = "0.1.5"
description = "Make an Android app Arabic with correct RTL: layout direction, attribute migration and bidi linting in one command."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gilgamesh-110" }]
keywords = ["android", "arabic", "rtl", "i18n", "localization", "apk", "bidi", "right-to-left"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Arabic",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Internationalization",
]

[project.urls]
Homepage = "https://github.com/Gilgamesh-110/aqlab"
Issues = "https://github.com/Gilgamesh-110/aqlab/issues"

[project.scripts]
aqlab = "aqlab:cli"

[tool.setuptools]
py-modules = ["aqlab"]
